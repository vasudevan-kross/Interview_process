# Render Blueprint — hosted backend for candidate-facing flows.
# AI evaluation stays local (LLM_ENABLED=false here); both deployments share Supabase.
services:
  - type: web
    name: interview-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: DEBUG
        value: "False"
      - key: LLM_ENABLED
        value: "false"
      - key: PADDLEOCR_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Values below are entered in the Render dashboard when the Blueprint is created
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
